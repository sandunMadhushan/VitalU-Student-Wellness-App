name: vitalu
description: "VitalU: personalised student health & wellness companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.17.2
  go_router: ^18.0.1
  material_symbols_icons: ^4.2960.0
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.0
  flutter_tts: ^4.2.5
  pedometer: ^4.2.0
  permission_handler: ^12.0.1
  http: ^1.6.0
  http_parser: ^4.1.2
  sensors_plus: ^7.1.0
  audioplayers: ^6.8.1
  confetti: ^0.8.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/art/
    - assets/body_shapes/
    - assets/badges/
    - assets/icons3d/
    - assets/food_groups/
    - assets/plate/
    - assets/sounds/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
