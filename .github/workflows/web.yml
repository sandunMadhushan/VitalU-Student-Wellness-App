name: Deploy web
on:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href "/"
      # The admin dashboard is a separate static site, served at /admin/.
      - run: cp -r admin build/web/admin
      # The pilot evaluation site (home page, feedback form, researcher view),
      # served at /evaluation/. It is self-contained, so the folder can also be
      # hosted on its own domain.
      - run: cp -r evaluation build/web/evaluation
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
