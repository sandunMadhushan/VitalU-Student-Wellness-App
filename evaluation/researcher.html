<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VitalU feedback responses</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body class="r-page">
  <div class="r-app">
    <aside class="r-side">
      <a class="brand" href="./"><img src="img/icon.png" alt=""> VitalU <span class="brand-tag">Research</span></a>
      <nav class="r-nav" aria-label="Pages">
        <a class="on" href="researcher.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Responses</a>
        <a href="form.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2M9 12h6M9 16h4"/><rect x="9" y="2.5" width="6" height="3.5" rx="1.2"/></svg>Feedback form</a>
        <a href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Project page</a>
      </nav>
      <div class="side-card">
        <div class="side-art" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.5 4 5.5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10v-6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></div>
        <strong>Anonymous by design</strong>
        <p>No names, emails or registration numbers are stored with responses.</p>
      </div>
    </aside>

    <div class="r-main">
      <header class="r-top">
        <a class="brand r-top-brand" href="./"><img src="img/icon.png" alt=""> VitalU</a>
        <div class="crumb"><span class="muted">Pilot evaluation</span><span class="sep">/</span><strong>Responses</strong></div>
        <div class="top-actions">
          <button class="icon-btn" type="button" data-theme-toggle title="Switch light or dark" aria-label="Switch light or dark theme">
            <svg class="when-light" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
            <svg class="when-dark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button class="btn ghost small" id="signout" hidden>Sign out</button>
        </div>
      </header>

      <main class="r-shell">
        <form id="login" class="r-login step" hidden>
          <h1>Feedback responses</h1>
          <p class="lead">For the research team only. Sign in with the account that has been given access.</p>
          <label>Email<input type="email" id="email" required autocomplete="username"></label>
          <label>Password<input type="password" id="password" required autocomplete="current-password"></label>
          <p class="error-msg" id="login-err" role="alert" hidden></p>
          <div class="form-actions"><button class="btn primary" type="submit" id="login-btn">Sign in</button></div>
        </form>

        <section id="dash" hidden>
          <div class="r-bar">
            <div>
              <h1>Feedback responses</h1>
              <p class="muted" id="summary-line"></p>
            </div>
            <div class="r-tools">
              <label class="sr-only" for="role-filter">Show responses from</label>
              <select id="role-filter">
                <option value="">Everyone</option>
                <option value="student">Undergraduates</option>
                <option value="staff">Lecturers, administration, staff and experts</option>
              </select>
              <button class="btn ghost" id="refresh" type="button">Refresh</button>
              <button class="btn primary" id="export" type="button">Download CSV</button>
            </div>
          </div>
          <div id="report"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="questions.js"></script>
  <script src="researcher.js"></script>
</body>
</html>
