<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VitalU feedback responses</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="./"><img src="img/icon.png" alt=""> VitalU</a>
      <button class="btn ghost" id="signout" hidden>Sign out</button>
    </div>
  </header>

  <main class="r-shell">
    <form id="login" class="r-login step" hidden>
      <h1>Feedback responses</h1>
      <p class="lead">For the research team only. Sign in with the account that has been given access.</p>
      <label>Email<input type="email" id="email" required autocomplete="username"></label>
      <label>Password<input type="password" id="password" required autocomplete="current-password"></label>
      <p class="error-msg" id="login-err" role="alert" hidden></p>
      <div class="form-actions"><button class="btn primary" type="submit" id="login-btn">Sign in</button></div>
    </form>

    <section id="dash" hidden>
      <div class="r-bar">
        <div>
          <h1>Feedback responses</h1>
          <p class="muted" id="summary-line"></p>
        </div>
        <div class="r-tools">
          <label class="sr-only" for="role-filter">Show responses from</label>
          <select id="role-filter">
            <option value="">Everyone</option>
            <option value="student">Undergraduates</option>
            <option value="staff">Lecturers, administration, staff and experts</option>
          </select>
          <button class="btn ghost" id="refresh" type="button">Refresh</button>
          <button class="btn primary" id="export" type="button">Download CSV</button>
        </div>
      </div>
      <div id="report"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="questions.js"></script>
  <script src="researcher.js"></script>
</body>
</html>
