<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VitalU feedback form</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body class="form-page">
  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="./"><img src="img/icon.png" alt=""> VitalU</a>
      <button class="icon-btn" type="button" data-theme-toggle title="Switch light or dark" aria-label="Switch light or dark theme">
          <svg class="when-light" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
          <svg class="when-dark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
    </div>
  </header>

  <main class="form-shell">
    <div class="progress" id="progress" hidden>
      <div class="track" role="progressbar" aria-label="Form progress" aria-valuemin="0" aria-valuemax="100"><i id="progress-fill" style="width:0%"></i></div>
      <span class="count" id="progress-count"></span>
    </div>
    <form id="step" class="step" novalidate></form>
  </main>

  <script src="config.js"></script>
  <script src="questions.js"></script>
  <script src="form.js"></script>
</body>
</html>
